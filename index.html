<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>বিবাহ কার্ড — PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#cf2b33}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#20242b;color:#e8e8e8;font-family:'Noto Serif Bengali',system-ui,sans-serif;display:flex;gap:18px;padding:18px;align-items:flex-start}

/* ---------- UI ---------- */
#ui{width:330px;flex:none;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;background:#2a2f38;border-radius:10px;padding:14px}
#ui h1{font-size:17px;margin:0 0 4px}
#ui .hint{font-size:12px;opacity:.75;line-height:1.6;margin:0 0 10px}
fieldset{border:1px solid #3d4553;border-radius:8px;margin:0 0 10px;padding:8px 10px}
legend{font-size:12px;color:#9fb0c7;padding:0 4px}
label{display:block;font-size:12px;color:#a9b4c4;margin:6px 0 2px}
input{width:100%;padding:6px 8px;border-radius:6px;border:1px solid #465064;background:#1b1f26;color:#eee;font:inherit;font-size:13px}
button{font:inherit;font-size:13px;padding:9px 10px;border-radius:8px;border:0;cursor:pointer;background:#3d4553;color:#eee}
#pdf{background:#b0121f;color:#fff;font-weight:600;width:100%}
#fs{width:100%}

/* ---------- pages: each page = one photo, edge to edge ---------- */
#stage{display:flex;flex-direction:column;gap:18px;transform-origin:top left}
.pg{position:relative;container-type:inline-size;overflow:hidden;box-shadow:0 6px 24px #0008;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pg img{display:block;width:100%;height:100%}
.p1{width:297mm;height:125.01mm;page:p1}
.p2{width:297mm;height:122.64mm;page:p2}
/* 3.jpeg holds two card pages -> split at the gap between them (y=1208 of 2426) */
.p3a,.p3b{background-image:url("3.jpeg");background-repeat:no-repeat;background-size:297mm auto}
.p3a{width:297mm;height:118.17mm;page:p3a;background-position:0 0}
.p3b{width:297mm;height:119.15mm;page:p3b;background-position:0 -118.17mm}

/* movable labels */
.mv{position:absolute;white-space:nowrap;cursor:grab;touch-action:none;line-height:1.4;border-radius:.6mm}
.mv:active{cursor:grabbing}
.lg{font-size:calc(var(--k,1) * 2.25cqw)}
.sm{font-size:calc(var(--k,1) * 1.75cqw)}
/* cover patch: shows a blank strip of the same photo, so it blends in */
.cov{background-image:url("1.jpeg");background-repeat:no-repeat;background-size:100cqw auto;padding:.6mm 1.2mm;width:var(--w)}

@media screen{
  #stage{zoom:var(--zoom,1)}
  .mv:hover{outline:1px dashed #c8102e99}
  .mv.sel{outline:1px dashed #0a7}
}
@page p1{size:297mm 125.01mm;margin:0}
@page p2{size:297mm 122.64mm;margin:0}
@page p3a{size:297mm 118.17mm;margin:0}
@page p3b{size:297mm 119.15mm;margin:0}
@media print{
  body{display:block;padding:0;background:#fff}
  #ui{display:none}
  #stage{zoom:1;gap:0}
  .pg{box-shadow:none;break-after:page}
  .pg:last-child{break-after:auto}
  .mv:hover,.mv.sel{outline:none}
}
</style>
</head>
<body>

<aside id="ui">
  <h1>বিবাহ কার্ড — PDF</h1>
  
  <button id="pdf">⬇ Download PDF</button>
  <div style="height:10px"></div>

  <fieldset><legend>১ম পাতা — প্রাপক</legend>
    <label>মাননীয় / মাননীয়া</label><input data-k="hon1" value="মাননীয় / মাননীয়া">
    <label>শ্রীযুক্ত / শ্রীযুক্তা</label><input data-k="hon2" value="শ্রীযুক্ত / শ্রীযুক্তা">
    <label>প্রাপকের নাম</label><input data-k="rname" placeholder="নাম">
    <label>প্রাপকের ঠিকানা</label><input data-k="raddr" placeholder="গ্রাম, ডাকঘর, জেলা">
  </fieldset>

  <fieldset><legend>১ম পাতা — প্রেরক</legend>
    <label>প্রেরকের নাম</label><input data-k="sname" value="শ্রী হরিহর মিশ্র">
    <label>প্রেরকের ঠিকানা</label><input data-k="saddr" value="নেহাট, বেনাডিহা, ঝাড়গ্রাম।">
    <label>মোবাইল</label><input data-k="sphone" value="মোঃ - 7001476094">
  </fieldset>

  <fieldset><legend>অ্যাডজাস্ট</legend>
    <label>লেখার সাইজ</label><input id="fs" type="range" min="0.7" max="1.5" step="0.05" value="1">
    <div style="height:8px"></div>
    <button id="reset">সব লেবেল আগের জায়গায়</button>
  </fieldset>
</aside>

<main id="stage">

  <section class="pg p1">
    <img src="1.jpeg" alt="">
    <div class="mv cov lg" style="left:54.4%;top:53.2%;--w:14.5%" data-sx="2160" data-sy="690"  data-k="hon1">মাননীয় / মাননীয়া</div>
    <div class="mv cov lg" style="left:55.0%;top:60.4%;--w:15%"   data-sx="2200" data-sy="700"  data-k="hon2">শ্রীযুক্ত / শ্রীযুক্তা</div>
    <div class="mv lg" style="left:69.5%;top:60.4%" data-k="rname"></div>
    <div class="mv lg" style="left:69.5%;top:68%"   data-k="raddr"></div>
    <div class="mv cov sm" style="left:28.4%;top:72.4%;--w:20.4%" data-sx="1560" data-sy="990"  data-k="sname">শ্রী হরিহর মিশ্র</div>
    <div class="mv cov sm" style="left:28.4%;top:78.5%;--w:20.4%" data-sx="1560" data-sy="1090" data-k="saddr">নেহাট, বেনাডিহা, ঝাড়গ্রাম।</div>
    <div class="mv cov sm" style="left:28.4%;top:85.2%;--w:20.4%" data-sx="1560" data-sy="1120" data-k="sphone">মোঃ - 7001476094</div>
  </section>

  <section class="pg p2"><img src="2.jpeg" alt=""></section>

  <section class="pg p3a"></section>

  <section class="pg p3b"></section>

</main>

<script>
const $ = s => document.querySelector(s);
const stage = $('#stage'), ui = $('#ui');
let Z = 1, sel = null, drag = null;

/* cover patches: show the same photo at an offset (image px -> cqw) */
const K = 100 / 3117;
document.querySelectorAll('.cov').forEach(el => {
  el.style.backgroundPosition = `${-el.dataset.sx * K}cqw ${-el.dataset.sy * K}cqw`;
});

document.addEventListener('input', e => {
  const k = e.target.dataset.k;
  if (!k) return;
  document.querySelectorAll(`#stage [data-k="${k}"]`).forEach(el => el.textContent = e.target.value);
});

/* drag labels */
stage.addEventListener('pointerdown', e => {
  const t = e.target.closest('.mv');
  if (!t) return;
  if (sel) sel.classList.remove('sel');
  sel = t; t.classList.add('sel');
  drag = { t, x: e.clientX, y: e.clientY, dx: +(t.dataset.dx || 0), dy: +(t.dataset.dy || 0) };
  t.setPointerCapture(e.pointerId);
  e.preventDefault();
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = drag.dx + (e.clientX - drag.x) / Z;
  const dy = drag.dy + (e.clientY - drag.y) / Z;
  drag.t.dataset.dx = Math.round(dx);
  drag.t.dataset.dy = Math.round(dy);
  drag.t.style.transform = `translate(${dx}px,${dy}px)`;
});
addEventListener('pointerup', () => drag = null);

/* keyboard nudge */
addEventListener('keydown', e => {
  if (!sel || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === 'Escape') { sel.classList.remove('sel'); sel = null; return; }
  const s = e.shiftKey ? 10 : 1;
  const d = { ArrowLeft:[-s,0], ArrowRight:[s,0], ArrowUp:[0,-s], ArrowDown:[0,s] }[e.key];
  if (!d) return;
  e.preventDefault();
  const nx = +(sel.dataset.dx || 0) + d[0], ny = +(sel.dataset.dy || 0) + d[1];
  sel.dataset.dx = nx; sel.dataset.dy = ny;
  sel.style.transform = `translate(${nx}px,${ny}px)`;
});

/* size + reset + pdf */
$('#fs').oninput = e => stage.style.setProperty('--k', e.target.value);
$('#reset').onclick = () => {
  document.querySelectorAll('.mv').forEach(t => {
    t.dataset.dx = 0; t.dataset.dy = 0; t.style.transform = ''; t.classList.remove('sel');
  });
  sel = null; $('#fs').value = 1; stage.style.setProperty('--k', 1);
};
/* pdf filename = <recipient>_bibaho_card_<timestamp>.pdf (browser adds .pdf) */
function fileName(){
  const d = new Date(), p = x => String(x).padStart(2, '0');
  const name = ($('[data-k="rname"]').value || 'bibaho').trim().replace(/[\\/:*?"<>|]+/g, '_');
  return `${name}_bibaho_card_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
$('#pdf').onclick = () => { document.title = fileName(); window.print(); };

/* fit preview on screen */
function fit(){
  const avail = innerWidth - ui.offsetWidth - 54;
  Z = Math.max(.2, Math.min(1, avail / 1123));   /* 297mm @96dpi */
  stage.style.setProperty('--zoom', Z);
}
addEventListener('resize', fit);

/* self-check: every input must have a target on a page */
document.querySelectorAll('#ui [data-k]').forEach(el => {
  if (!document.querySelector(`#stage [data-k="${el.dataset.k}"]`))
    console.warn('no target for:', el.dataset.k);
});

fit();
</script>
</body>
</html>
